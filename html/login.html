<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Equipment Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      /* Sports-themed vibrant gradient */
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 30%, #ff6f00 60%, #ffcc00 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 50px 40px 30px;
      border-radius: 20px;
      width: 100%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
      position: relative;
      border: 2px solid rgba(255,255,255,0.2);
    }

    /* Circle avatar */
    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #ffcc00;
      position: absolute;
      top: -35px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .container h1 {
      font-size: 1.6rem;
      margin: 40px 0 20px;
      font-weight: 600;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }

    .container input[type="text"],
    .container input[type="password"] {
      width: 100%;
      height: 45px;
      margin: 12px 0;
      font-size: 0.95rem;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      outline: none;
      background: rgba(255, 255, 255, 0.95);
      transition: 0.3s;
    }

    .container input[type="text"]:focus,
    .container input[type="password"]:focus {
      border: 2px solid #ff6f00;
    }

    .container input[type="submit"] {
      background: linear-gradient(135deg, #ff6f00, #ffcc00);
      color: #fff;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 1px;
      transition: transform 0.2s, background 0.3s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .container input[type="submit"]:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #ffcc00, #ff6f00);
    }

    .btn {
      margin-top: 12px;
    }

    .btn a {
      display: inline-block;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #28a745, #00d4ff);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.3s ease;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    .btn a:hover {
      background: linear-gradient(135deg, #00d4ff, #28a745);
    }

    .container p {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #fff;
    }

    .container p a {
      color: #ffd700; /* sporty yellow */
      text-decoration: none;
      font-weight: 600;
    }

    .container p a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="avatar">🏀</div>
    <form method="POST" action="../php/login.php">
      <h1>Log In</h1>
      <input type="text" id="Uname" name="xUname" placeholder="Student ID" required>
      <input type="password" id="pass" name="xpass" placeholder="Password" required>
      <input type="submit" name="login" value="LOG IN">
      <div class="btn">
        <a href="../index.html">CANCEL</a>
      </div>
      <p>Don't have an account? <a href="../html/register.html"><i>Sign up!</i></a></p>
      <p>Log in as admin! <a href="../html/adminlog.html"><i>Log in!</i></a></p>
    </form>
  </div>
</body>
</html>
