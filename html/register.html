<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register Form</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" integrity="sha384-k6RqeWeci5ZR/Lv4MR0sA0FfDOMT4x4c9d0jRH7N8B6I64f4e0N1kUs3Vo69kP8" crossorigin="anonymous">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      /* Sports-themed vibrant gradient */
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 30%, #ff6f00 60%, #ffcc00 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 30px;
      border-radius: 20px;
      width: 50%;
      max-height: 90vh;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
      overflow-y: auto;
      border: 2px solid rgba(255,255,255,0.2);
    }

    .container h1 {
      color: #fff;
      font-size: 2em;
      margin-bottom: 20px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }

    .container p {
      margin-top: 20px;
      font-size: 0.9em;
      color: #fff;
    }

    .container a {
      color: #ffd700;
      font-weight: 600;
    }

    .form-group {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .form-group > div {
      width: 48%;
    }

    .form-group label {
      font-size: 0.9em;
      color: #fff;
      font-weight: bold;
      margin-bottom: 10px;
      display: inline-block;
    }

    .form-group label i {
      margin-right: 10px;
      color: #ff6f00;
    }

    .form-group input[type="text"], 
    .form-group input[type="password"], 
    .form-group select {
      width: 100%;
      height: 40px;
      padding: 10px;
      font-size: 0.9em;
      border: 1px solid #fff;
      border-radius: 8px;
      margin-bottom: 15px;
      transition: border-color 0.3s ease, background 0.3s ease;
      background: rgba(255, 255, 255, 0.85);
    }

    .form-group input[type="text"]:focus,
    .form-group input[type="password"]:focus,
    .form-group select:focus {
      border-color: #ffcc00;
    }

    .container input[type="submit"] {
      background: linear-gradient(135deg, #ff6f00, #ffcc00);
      color: #fff;
      border: none;
      border-radius: 8px;
      width: 50%;
      padding: 15px;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
      margin-top: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .container input[type="submit"]:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #ffcc00, #ff6f00);
    }

    @media (max-width: 768px) {
      .container {
        width: 90%;
      }

      .form-group {
        flex-direction: column;
      }

      .form-group > div {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <form action="../php/register.php" method="POST">
      <h1>Sign Up</h1>

      <div class="form-group">
        <div>
          <label for="Id"><i class="fas fa-id-card"></i> Student ID</label>
          <input type="text" id="Id" name="xId" placeholder="Student ID" required>
          
          <label for="Fname"><i class="fas fa-user"></i> First Name</label>
          <input type="text" id="Fname" name="xFname" placeholder="First Name" required>
          
          <label for="Mname"><i class="fas fa-user"></i> Middle Name</label>
          <input type="text" id="Mname" name="xMname" placeholder="Middle Name" required>

          <label for="Lname"><i class="fas fa-user"></i> Last Name</label>
          <input type="text" id="Lname" name="xLname" placeholder="Last Name" required>
          
          <label for="Gender"><i class="fas fa-venus-mars"></i> Gender</label>
          <select id="Gender" name="xGender" required>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>

        <div>
          <label for="Course"><i class="fas fa-book"></i> Course</label>
          <select id="Course" name="xCourse" required>
            <option value="BS Info. Tech.">BS Info. Tech.</option>
            <option value="BS Criminology">BS Criminology</option>
            <option value="BS Industrial Tech.">BS Industrial Tech.</option>
            <option value="BS Hotel Management">BS Hotel Management</option>
            <option value="BS Education">BS Education</option>
          </select>

          <label for="Year"><i class="fas fa-calendar-alt"></i> Year</label>
          <select id="Year" name="xYear" required>
            <option value="1">1st Year</option>
            <option value="2">2nd Year</option>
            <option value="3">3rd Year</option>
            <option value="4">4th Year</option>
          </select>

          <label for="Section"><i class="fas fa-graduation-cap"></i> Section</label>
          <input type="text" id="Section" name="xSection" placeholder="Section" required>

          <label for="Email"><i class="fas fa-envelope"></i> Email</label>
          <input type="text" id="Email" name="xEmail" placeholder="Email" required>

          <label for="Password"><i class="fas fa-lock"></i> Password</label>
          <input type="password" id="Password" name="xPassword" placeholder="Password" required>
        </div>
      </div>

      <input type="submit" value="Sign Up">
      <p>Already have an account? <i><a href="login.html">Log In!</a></i></p>
    </form>
  </div>

  <script type="text/javascript" src="../jquery/jquery.js"></script>
  <script type="text/javascript" src="../js/index.js"></script>

</body>
</html>
